[package]
name = "routex402-app"
version = "0.1.0"
edition = "2024"
description = "Read-only Aomi App: verified reputation checks for AI agent payments (Routex402, Solana devnet)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aomi-sdk = "7.0.0"
schemars = "1.0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
